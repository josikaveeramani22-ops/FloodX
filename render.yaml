# Render.com blueprint
# Steps: push this repo to GitHub → render.com → New Blueprint → select repo.
# Output: https://<app>.onrender.com  (dashboard /v2, citizen /userv2, /budget, /docs)
services:
  - type: web
    name: floodx
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fastapi_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Optional: keep SQLite readings across restarts.
    # disk:
    #   name: floodx-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1